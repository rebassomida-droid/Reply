version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reply_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-reply_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reply_pass}
      POSTGRES_DB: ${DB_NAME:-reply_voice}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
